name: PharmaTrace Frontend

on:
  push:
    branches: [main]
    paths:
      - "pharmatrace/app/**"
      - ".github/workflows/pharmatrace-app.yml"
  pull_request:
    paths:
      - "pharmatrace/app/**"
      - ".github/workflows/pharmatrace-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharmatrace/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run build
