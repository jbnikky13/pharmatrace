name: Deploy PharmaTrace to Arc Mainnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: arc-mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: |
          mkdir -p pharmatrace/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std pharmatrace/lib/forge-std
      - name: Preflight Arc Mainnet
        working-directory: pharmatrace
        run: |
          test "$(cast chain-id --rpc-url https://rpc.mainnet.arc.io)" = "5042"
      - name: Build contract
        working-directory: pharmatrace
        run: forge build
      - name: Deploy
        working-directory: pharmatrace
        env:
          PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY"
          forge script script/DeployPharmaTrace.s.sol:DeployPharmaTrace --rpc-url https://rpc.mainnet.arc.io --broadcast
