name: Prepare PharmaTrace Arc Mainnet Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: |
          mkdir -p pharmatrace/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std pharmatrace/lib/forge-std
      - name: Verify Arc Mainnet
        run: test "$(cast chain-id --rpc-url https://rpc.mainnet.arc.io)" = "5042"
      - name: Build
        working-directory: pharmatrace
        run: forge build
      - name: Create deployment artifact
        working-directory: pharmatrace
        run: |
          forge inspect PharmaTrace abi > PharmaTrace.abi.json
          forge inspect PharmaTrace bytecode > PharmaTrace.bytecode.txt
          tar -czf pharmatrace-arc-deployment.tgz PharmaTrace.abi.json PharmaTrace.bytecode.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pharmatrace-arc-deployment
          path: pharmatrace/pharmatrace-arc-deployment.tgz
