name: PharmaTrace Arc Contract

on:
  push:
    branches: [main]
    paths:
      - "pharmatrace/contracts/**"
      - "pharmatrace/test/**"
      - "pharmatrace/script/**"
      - "pharmatrace/foundry.toml"
      - ".github/workflows/arc-contract.yml"
      - "README.md"
  pull_request:
    paths:
      - "pharmatrace/contracts/**"
      - "pharmatrace/test/**"
      - "pharmatrace/script/**"
      - "pharmatrace/foundry.toml"
      - ".github/workflows/arc-contract.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharmatrace
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit
      - name: Run Solidity tests
        run: forge test -vvv
      - name: Build contracts
        run: forge build

      - name: Export PharmaTrace deployment artifact
        run: |
          mkdir -p deployment-artifact
          cp out/PharmaTrace.sol/PharmaTrace.json deployment-artifact/PharmaTrace.json
          jq '{abi: .abi, bytecode: .bytecode.object, deployedBytecode: .deployedBytecode.object}' \
            out/PharmaTrace.sol/PharmaTrace.json > deployment-artifact/PharmaTrace.artifact.json

      - name: Upload PharmaTrace artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmatrace-contract-artifact
          path: pharmatrace/deployment-artifact/

  deploy-mainnet:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-arc]'))
    needs: test
    runs-on: ubuntu-latest
    environment: arc-mainnet
    defaults:
      run:
        working-directory: pharmatrace
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit
      - name: Deploy PharmaTrace to Arc Mainnet
        env:
          PRIVATE_KEY: ${{ secrets.ARC_DEPLOYER_PRIVATE_KEY }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "::error::ARC_DEPLOYER_PRIVATE_KEY is not configured for the arc-mainnet environment."; exit 1; }
          case "$PRIVATE_KEY" in
            0x*) ;;
            *) echo "::error::ARC_DEPLOYER_PRIVATE_KEY must start with 0x."; exit 1 ;;
          esac
          forge script script/DeployPharmaTrace.s.sol:DeployPharmaTrace --rpc-url arc --broadcast
